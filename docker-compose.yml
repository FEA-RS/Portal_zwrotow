
services:
  database:
    image: "postgres:16"
    restart: unless-stopped
    ports: 
      - 5432:5432

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
   
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5 
    deploy:
      resources:
        limits:
          memory: 2G 
    volumes:
    - postgresql:/var/lib/postgresql/data/

  chromadb:
    image: "chromadb/chroma:1.5.9"
    restart: unless-stopped
    ports:
        - "8000:8000"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
    - chroma:/data

volumes:
  chroma:
  postgresql:

