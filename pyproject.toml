[build-system]
# Używamy hatchling jako nowoczesnego, standardowego backendu budującego
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"] 


[project]
name = "Portal-Zwrotow"
version = "0.1.0"
description = "Backend API ze wsparciem RAG i grafów wywołań"
readme = "README.md"
requires-python = ">=3.12"

# Zależności produkcyjne
dependencies = [
    "fastapi>=0.111.0",
    "asyncpg>=0.29.0",
    "chromadb>=0.5.0",
    "langgraph>=0.0.60",
    "pydantic>=2.7.0",
    "tenacity>=8.3.0"
]

[project.optional-dependencies]
# Zależności deweloperskie
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio"
]

# ------------------------------------------------------------------------------
# KONFIGURACJA NARZĘDZI (Ruff, Mypy, Pytest)
# ------------------------------------------------------------------------------

[tool.ruff]
# Główne ustawienia lintera i formattera
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
]

[tool.ruff.lint]
# E (pycodestyle), F (pyflakes), I (isort) - standardowy i bezpieczny zestaw reguł
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
# Wymusza standardowe formatowanie kodu (podobne do Blacka)
quote-style = "double"
indent-style = "space"


[tool.mypy]
# Ustawienia statycznego typowania
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Ignorowanie brakujących typów z bibliotek trzecich
[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "chromadb.*",
    "langgraph.*"
]
ignore_missing_imports = true


[tool.pytest.ini_options]
# Konfiguracja frameworka testowego
minversion = "7.0"
testpaths = [
    "tests",
]
# pytest-asyncio potrzebuje informacji, jak traktować testy asynchroniczne
asyncio_mode = "auto"
